<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>monkeytype DOM fixture (dev test)</title>
  <!-- Minimal stand-in for monkeytype's test page: same ids/classes the overlay relies on
       (#typingTest > #wordsWrapper > #words .word.active letter.correct|incorrect) and the
       serika dark theme variables. For local testing of the bundled overlay only. -->
  <style>
    :root { --bg-color: #323437; --main-color: #e2b714; --caret-color: #e2b714; --sub-color: #646669; --sub-alt-color: #2c2e31;
      --text-color: #d1d0c5; --error-color: #ca4754; --font: "Roboto Mono", "SF Mono", Menlo, monospace; }
    body { margin: 0; background: var(--bg-color); color: var(--text-color); font-family: var(--font); }
    #typingTest { max-width: 1000px; margin: 80px auto 0; padding: 0 20px; }
    #liveStats { text-align: center; color: var(--main-color); font-size: 1.6rem; margin-bottom: .4rem; }
    #wordsWrapper { position: relative; }
    #wordsInput { position: absolute; opacity: 0; width: 1px; height: 1px; }
    #words { display: flex; flex-wrap: wrap; font-size: 1.5rem; color: var(--sub-color); height: 7.5rem; overflow: hidden; }
    .word { margin: .25em .3em; }
    letter.correct { color: var(--text-color); }
    letter.incorrect { color: var(--error-color); }
    .hints { display: none; }
  </style>
</head>
<body>
  <div id="typingTest">
    <div id="liveStats">0/0</div>
    <div id="wordsWrapper">
      <textarea id="wordsInput"></textarea>
      <div id="words"></div>
    </div>
    <div class="after-words"></div>
  </div>
  <script>
    const text = 'Shift then letters: Hello World Again symbols {braces} [x] = 42; über straße'.split(' ');
    const words = document.getElementById('words');
    let cur = 0, typed = [''];
    function render() {
      words.innerHTML = '';
      text.forEach((w, i) => {
        const d = document.createElement('div');
        d.className = 'word' + (i === cur ? ' active' : '');
        d.dataset.wordindex = i;
        const t = typed[i] || '';
        for (let j = 0; j < Math.max(w.length, t.length); j++) {
          const l = document.createElement('letter');
          if (j >= w.length) { l.className = 'incorrect extra'; l.textContent = t[j]; }
          else { l.textContent = w[j]; if (j < t.length) l.className = t[j] === w[j] ? 'correct' : 'incorrect'; }
          d.appendChild(l);
        }
        const hints = document.createElement('div'); hints.className = 'hints'; d.appendChild(hints);
        words.appendChild(d);
      });
      document.getElementById('liveStats').textContent = `${cur}/${text.length}`;
    }
    const input = document.getElementById('wordsInput');
    input.addEventListener('keydown', (e) => {
      if (e.key === ' ') { if (typed[cur]) { cur++; typed[cur] = ''; } e.preventDefault(); }
      else if (e.key === 'Backspace') typed[cur] = typed[cur].slice(0, -1);
      else if (e.key.length === 1) typed[cur] += e.key;
      else return;
      render();
    });
    render();
    input.focus();
    window.mtType = (s) => { for (const ch of s) { input.dispatchEvent(new KeyboardEvent('keydown', { key: ch, code: ch === ' ' ? 'Space' : 'Key' + ch.toUpperCase(), bubbles: true })); input.dispatchEvent(new KeyboardEvent('keyup', { key: ch, code: ch === ' ' ? 'Space' : 'Key' + ch.toUpperCase(), bubbles: true })); } };
  </script>
  <script src="../monkeytype/extension/halcyon-monkeytype.js"></script>
</body>
</html>
